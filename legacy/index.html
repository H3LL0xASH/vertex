<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>vertex — Beyond Possibilities</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/vertex-3d.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--v-font);background:var(--v-bg);color:var(--v-ink);overflow-x:hidden}
.stage{min-height:100vh;display:flex;width:100%;animation:pageIn .7s ease both}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ================= LEFT 3D SCENE ================= */
.visual{position:relative;width:58%;min-height:100vh;overflow:hidden;
  background:
    radial-gradient(110% 70% at 8% 0%, #d9e7ff 0%, #e8efff 30%, rgba(232,239,255,0) 62%),
    linear-gradient(180deg,#edf2ff 0%,#ebe9f6 34%,#f8e7e4 68%,#f0d9d2 100%);
  display:flex;align-items:center;justify-content:center}
.dome{position:absolute;left:-24%;top:-20%;width:80%;height:64%;border-radius:50%;transform:rotate(-10deg);
  background:radial-gradient(circle at 34% 30%, #e2ecfd 0%, #b9cdec 28%, #93aed9 52%, #7e9ccb 62%, #c3d4ee 82%, #e9f0fd 100%);
  box-shadow:inset -34px -46px 90px rgba(255,255,255,.65), inset 24px 30px 70px rgba(255,255,255,.35), 30px 40px 90px rgba(130,150,195,.35)}
.dome::after{content:'';position:absolute;inset:10% 7% 8% 9%;border-radius:50%;
  background:radial-gradient(70% 55% at 32% 26%, rgba(255,255,255,.75), transparent 62%)}
.fabric{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sheet-shadow{position:absolute;left:-14%;top:30%;width:96%;height:8%;border-radius:50%;filter:blur(22px);background:rgba(105,110,150,.20);transform:rotate(-6deg)}
.v3-sphere.s-top{width:116px;height:116px;right:17%;top:19%;z-index:5}
.v3-sphere.s-bot{width:108px;height:108px;left:6.5%;bottom:13.5%;z-index:5;
  background:radial-gradient(circle at 32% 28%, #fff 0%, #f4eaed 14%, #dcc3c9 38%, #b69ba4 62%, #e7d0d4 86%);
  box-shadow:16px 24px 42px rgba(90,90,110,.30), inset -8px -12px 22px rgba(120,100,110,.25), inset 9px 11px 20px rgba(255,255,255,.95)}
.shadow-top{right:calc(17% - 6px);top:calc(19% + 118px);width:120px;height:22px;z-index:4}
.shadow-bot{left:calc(6.5% - 8px);bottom:calc(13.5% - 24px);width:124px;height:24px;z-index:4}
.brand3d{position:relative;z-index:6;text-align:center;transform:translateY(-7%);padding-right:7%;will-change:transform}
.brand3d h1{font-size:clamp(76px,8.4vw,136px);line-height:.9}
.brand3d h1.v3-text{font-size:clamp(76px,8.4vw,136px)}
.brand3d .tag{margin-top:20px;font-size:12.5px;letter-spacing:.6em;text-indent:.6em;font-weight:600;color:#7c6a8b}
.brand3d .text-floor{margin:26px auto 0;width:62%;height:20px;border-radius:50%;filter:blur(14px);background:rgba(90,85,120,.25)}
.float-a{animation:floatA 6s ease-in-out infinite}
.float-b{animation:floatA 7.6s ease-in-out infinite reverse}
@keyframes floatA{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}

/* wavy inflated seam between panels */
.seam{position:absolute;right:-2px;top:0;height:100%;width:104px;z-index:7;pointer-events:none}
.seam svg{width:100%;height:100%;display:block;overflow:visible}

/* ================= RIGHT LOGIN ================= */
.login{width:42%;background:radial-gradient(65% 55% at 50% 36%, #ffffff 0%, rgba(255,255,255,0) 70%), var(--v-bg);
  display:flex;align-items:center;justify-content:center;position:relative}
.login-card{position:relative;width:min(430px,88%);display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px 0}
.logo-flat{font-family:var(--v-brand);font-weight:800;font-size:clamp(58px,4.9vw,80px);letter-spacing:-.055em;line-height:1;color:#101728;
  text-shadow:0 1px 0 #fff, 0 2px 0 #e8ecf3, 0 3px 0 #d5dbe7, 0 10px 24px rgba(20,30,60,.18)}
.logo-sub{margin-top:12px;font-size:12.5px;letter-spacing:.64em;text-indent:.64em;color:var(--v-muted);font-weight:600}
.avatar-ring{margin-top:40px;width:134px;height:134px}
.avatar-ring.v3-avatar-ring{width:134px;height:134px}
.avatar-core{v3-avatar-core;width:100%;height:100%}
.v3-avatar-core svg{width:56%;height:56%;fill:#fff;filter:drop-shadow(0 3px 4px rgba(120,30,40,.28))}
.field{margin-top:36px;width:100%;max-width:368px;position:relative}
.input-pill{width:100%;height:64px;display:flex;align-items:center;gap:14px;padding:0 20px 0 24px;cursor:pointer;
  transition:transform .18s ease}
.input-pill:hover{transform:translateY(-1px)}
.input-pill .u{width:27px;height:27px;fill:#6b7280;flex-shrink:0;filter:drop-shadow(0 1px 1px #fff)}
.input-pill input{flex:1;border:0;outline:0;background:transparent;font-size:18px;font-weight:500;color:var(--v-ink);font-family:inherit;min-width:0}
.input-pill input::placeholder{color:#6b7280}
.chev{width:26px;height:26px;flex-shrink:0;transition:transform .25s;filter:drop-shadow(0 1px 0 #fff)}
.field.open .chev{transform:rotate(180deg)}
.field:focus-within .input-pill{box-shadow:0 0 0 3px rgba(124,58,237,.18), var(--v3-out-md), var(--v3-in-soft)}
.dropdown{position:absolute;left:8px;right:8px;top:74px;background:var(--v-card);border:1px solid rgba(255,255,255,.9);
  border-radius:18px;box-shadow:var(--v3-out-md);overflow:hidden;opacity:0;transform:translateY(-8px) scale(.98);
  pointer-events:none;transition:.22s;z-index:20;text-align:left}
.field.open .dropdown{opacity:1;transform:none;pointer-events:auto}
.dropdown button{width:100%;display:flex;align-items:center;gap:12px;padding:13px 18px;border:0;background:transparent;
  font-size:15px;font-weight:500;color:var(--v-ink);cursor:pointer;font-family:inherit}
.dropdown button:hover{background:#f2f4fa}
.dropdown .dot{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  color:#fff;font-weight:800;font-size:14px;box-shadow:inset 2px 3px 5px rgba(255,255,255,.5), inset -2px -3px 5px rgba(0,0,0,.18), 0 4px 10px rgba(0,0,0,.15)}
.cta{margin-top:46px;width:258px;height:60px;font-size:19px;font-weight:500;letter-spacing:.01em;
  display:flex;align-items:center;justify-content:center;gap:16px;font-family:inherit}
.cta .shine{position:absolute;top:0;bottom:0;width:46px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
  transform:skewX(-18deg);left:-70px;animation:sweep 3.4s ease-in-out infinite;pointer-events:none}
@keyframes sweep{0%,55%{left:-70px}85%,100%{left:120%}}
.cta svg{width:28px;height:28px}
.cta.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
.toast{margin-top:22px;min-height:22px;font-size:14px;color:#16a34a;font-weight:600;opacity:0;transition:.3s}
.toast.show{opacity:1}
.hint{margin-top:10px;font-size:11.5px;letter-spacing:.14em;color:var(--v-muted);font-weight:600}

@media (max-width:960px){
  .stage{flex-direction:column}
  .visual{width:100%;min-height:54vh}
  .brand3d{padding-right:0}
  .brand3d h1.v3-text{font-size:66px}
  .seam{display:none}
  .login{width:100%;padding:28px 0 64px}
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <!-- LEFT 3D SCENE -->
  <section class="visual" id="visual">
    <div class="dome"></div>

    <!-- layered fabric waves : back sheet / mid fold / front glossy fold -->
    <svg class="fabric" viewBox="0 0 700 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f7e0e4"/><stop offset=".45" stop-color="#f1d2d7"/><stop offset="1" stop-color="#f8e9e3"/>
        </linearGradient>
        <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f4d9d8"/><stop offset=".5" stop-color="#fae6e1"/><stop offset="1" stop-color="#f6c3bd"/>
        </linearGradient>
        <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#e6c2bd"/><stop offset=".22" stop-color="#f2d3cd"/><stop offset=".55" stop-color="#ffded7"/><stop offset="1" stop-color="#ff9d95"/>
        </linearGradient>
        <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#8a7f9a" flood-opacity="0.28"/>
        </filter>
      </defs>
      <!-- back pale sheet -->
      <path filter="url(#softShadow)" fill="url(#sheet)"
        d="M-40,330 C120,240 300,230 440,300 C540,350 600,430 620,560 L640,900 L-40,900 Z"/>
      <!-- mid rolling fold -->
      <path filter="url(#softShadow)" fill="url(#mid)"
        d="M-40,560 C120,540 220,500 330,540 C430,578 480,640 560,700 C610,738 640,780 650,900 L-40,900 Z"/>
      <!-- front glossy fold -->
      <path filter="url(#softShadow)" fill="url(#front)"
        d="M-40,640 C80,620 170,600 260,630 C360,664 420,730 500,800 C550,844 600,870 640,900 L-40,900 Z"/>
      <!-- gloss streak on front fold -->
      <path fill="url(#gloss)" opacity=".8"
        d="M60,648 C150,632 230,634 310,662 C250,668 150,668 60,682 Z"/>
      <path fill="url(#gloss)" opacity=".55"
        d="M300,700 C380,716 440,760 490,806 C430,782 350,740 290,716 Z"/>
    </svg>
    <div class="sheet-shadow"></div>

    <div class="v3-floor-shadow shadow-top" id="shTop"></div>
    <div class="v3-sphere s-top float-a" id="spTop"></div>
    <div class="v3-floor-shadow shadow-bot" id="shBot"></div>
    <div class="v3-sphere s-bot float-b" id="spBot"></div>

    <div class="brand3d" id="brand3d">
      <h1 class="v3-text">vertex</h1>
      <p class="tag">BEYOND POSSIBILITIES</p>
      <div class="text-floor"></div>
    </div>

    <div class="seam" aria-hidden="true">
      <svg viewBox="0 0 104 900" preserveAspectRatio="none">
        <defs>
          <filter id="seamGlow" x="-40%" y="-5%" width="180%" height="110%">
            <feDropShadow dx="-7" dy="0" stdDeviation="12" flood-color="#ff8d8a" flood-opacity="0.6"/>
          </filter>
        </defs>
        <path d="M60,0 C32,150 80,280 52,420 C26,552 64,680 38,900 L64,900 C90,680 50,552 76,420 C104,280 58,150 88,0 Z"
          fill="#ffb6b3" filter="url(#seamGlow)"/>
        <path d="M72,0 C44,150 90,280 62,420 C36,552 74,680 48,900 L104,900 L104,0 Z" fill="#f5f7fc"/>
        <path d="M72,0 C44,150 90,280 62,420 C36,552 74,680 48,900" fill="none" stroke="#ffffff" stroke-width="3" opacity=".8"/>
      </svg>
    </div>
  </section>

  <!-- RIGHT LOGIN -->
  <section class="login">
    <div class="login-card">
      <h2 class="logo-flat">vertex</h2>
      <p class="logo-sub">WELCOME BACK</p>

      <div class="avatar-ring v3-avatar-ring">
        <div class="v3-avatar-core" style="width:100%;height:100%">
          <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2.1c-3.3 0-9.8 1.6-9.8 4.9v2.8c0 .6.4 1 1 1h17.6c.6 0 1-.4 1-1V19c0-3.3-6.5-4.9-9.8-4.9z"/></svg>
        </div>
      </div>

      <div class="field" id="field">
        <div class="v3-pill input-pill" id="pill">
          <svg class="u" viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2.1c-3.3 0-9.8 1.6-9.8 4.9v2.8c0 .6.4 1 1 1h17.6c.6 0 1-.4 1-1V19c0-3.3-6.5-4.9-9.8-4.9z"/></svg>
          <input id="nameInput" type="text" placeholder="Enter name" autocomplete="off" />
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </div>
        <div class="dropdown" id="dropdown">
          <button data-name="Aarav Sharma"><span class="dot" style="background:linear-gradient(180deg,#f2aeb4,#cf707a)">A</span> Aarav Sharma</button>
          <button data-name="Sophia Lee"><span class="dot" style="background:linear-gradient(180deg,#9db6e0,#5b7bb4)">S</span> Sophia Lee</button>
          <button data-name="John Carter"><span class="dot" style="background:linear-gradient(180deg,#7ed6a5,#2f9e68)">J</span> John Carter</button>
        </div>
      </div>

      <button class="v3-btn-red cta" id="continueBtn">
        <span class="shine"></span>
        <span id="btnText">Continue</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </button>
      <div class="toast" id="toast"></div>
      <div class="hint">3D SECURE &nbsp;·&nbsp; VERTEX ID</div>
    </div>
  </section>
</div>

<script>
const field = document.getElementById('field');
const pill = document.getElementById('pill');
const input = document.getElementById('nameInput');
const btn = document.getElementById('continueBtn');
const btnText = document.getElementById('btnText');
const toast = document.getElementById('toast');

pill.addEventListener('click', (e) => {
  if (e.target !== input) {
    field.classList.toggle('open');
    if (field.classList.contains('open')) input.focus();
  }
});
input.addEventListener('focus', () => field.classList.add('open'));
input.addEventListener('input', () => { toast.classList.remove('show'); btnText.textContent = 'Continue'; });
document.querySelectorAll('.dropdown button').forEach(b => {
  b.addEventListener('click', (e) => {
    e.stopPropagation();
    input.value = b.dataset.name;
    field.classList.remove('open');
    input.focus();
  });
});
document.addEventListener('click', (e) => { if (!field.contains(e.target)) field.classList.remove('open'); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') field.classList.remove('open');
  if (e.key === 'Enter') doContinue();
});
btn.addEventListener('click', doContinue);

function doContinue(){
  const name = input.value.trim();
  if(!name){
    btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake');
    input.focus(); return;
  }
  btnText.textContent = 'Welcome, ' + name.split(' ')[0];
  toast.textContent = '✓ Signed in as ' + name;
  toast.classList.add('show');
  field.classList.remove('open');
  try { localStorage.setItem('vertexName', name); } catch(e) {}
  setTimeout(() => { window.location.href = 'dashboard.html?name=' + encodeURIComponent(name); }, 650);
}

// subtle 3D parallax — spheres + brand drift with mouse
const visual = document.getElementById('visual');
const brand3d = document.getElementById('brand3d');
const spTop = document.getElementById('spTop');
const spBot = document.getElementById('spBot');
visual.addEventListener('mousemove', (e) => {
  const r = visual.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width - .5;
  const y = (e.clientY - r.top) / r.height - .5;
  brand3d.style.transform = 'translate(' + (x*14) + 'px,' + (y*10 - 14) + 'px)';
  spTop.style.marginLeft = (x*22) + 'px'; spTop.style.marginTop = (y*16) + 'px';
  spBot.style.marginLeft = (x*-18) + 'px'; spBot.style.marginTop = (y*-12) + 'px';
});
visual.addEventListener('mouseleave', () => {
  brand3d.style.transform = ''; spTop.style.marginLeft = ''; spTop.style.marginTop = '';
  spBot.style.marginLeft = ''; spBot.style.marginTop = '';
});
</script>
</body>
</html>
